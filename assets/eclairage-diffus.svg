<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ln" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0f766e"/></marker>
    <marker id="ll" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="720" height="380" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="378" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">L'éclairage diffus : la lumière reçue dépend de l'angle</text>
  <text x="360" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">N est la normale (la direction « vers le haut » de la surface), L pointe vers la lumière. La luminosité vaut N · L.</text>
    <rect x="80" y="250" width="140" height="26" rx="3" fill="rgb(240,200,120)" stroke="#475569" stroke-width="1.5"/>
  <line x1="150" y1="250" x2="150" y2="180" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ln)"/>
  <text x="158" y="190" font-size="13" fill="#0f766e" font-weight="700">N</text>
  <circle cx="150" cy="129" r="13" fill="#fbbf24"/>
  <line x1="150" y1="129" x2="132" y2="247" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ll)"/>
  <text x="136" y="184" font-size="12" fill="#b45309" font-weight="700">L</text>
  <text x="150" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b2a4a">Lumière de face</text>
  <text x="150" y="330" text-anchor="middle" font-size="12" fill="#64748b">N · L = 1</text>
  <rect x="290" y="250" width="140" height="26" rx="3" fill="rgb(178,147,84)" stroke="#475569" stroke-width="1.5"/>
  <line x1="360" y1="250" x2="360" y2="180" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ln)"/>
  <text x="368" y="190" font-size="13" fill="#0f766e" font-weight="700">N</text>
  <circle cx="293" cy="157" r="13" fill="#fbbf24"/>
  <line x1="293" y1="157" x2="342" y2="247" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ll)"/>
  <text x="312" y="197" font-size="12" fill="#b45309" font-weight="700">L</text>
  <text x="360" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b2a4a">Lumière de biais</text>
  <text x="360" y="330" text-anchor="middle" font-size="12" fill="#64748b">N · L ≈ 0,7</text>
  <rect x="500" y="250" width="140" height="26" rx="3" fill="rgb(59,45,20)" stroke="#475569" stroke-width="1.5"/>
  <line x1="570" y1="250" x2="570" y2="180" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ln)"/>
  <text x="578" y="190" font-size="13" fill="#0f766e" font-weight="700">N</text>
  <circle cx="476" cy="211" r="13" fill="#fbbf24"/>
  <line x1="476" y1="211" x2="552" y2="247" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ll)"/>
  <text x="509" y="224" font-size="12" fill="#b45309" font-weight="700">L</text>
  <text x="570" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b2a4a">Lumière rasante</text>
  <text x="570" y="330" text-anchor="middle" font-size="12" fill="#64748b">N · L ≈ 0</text>
  <text x="360" y="358" text-anchor="middle" font-size="12.5" fill="#1b2a4a">Plus la lumière arrive de face (alignée avec N), plus la surface est éclairée ; rasante, elle reste sombre.</text>
</svg>
