<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="380" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="378" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">Collision de boîtes (AABB) : se chevauchent-elles ?</text>
  <text x="360" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">Deux boîtes alignées sur les axes se touchent si et seulement si leurs intervalles se croisent EN X ET EN Y.</text>

  <rect x="300" y="175" width="120" height="110" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"><animate attributeName="fill" values="#bfdbfe;#bfdbfe;#fca5a5;#fca5a5;#bfdbfe;#bfdbfe" keyTimes="0;0.25;0.255;0.75;0.755;1" dur="6.0s" repeatCount="indefinite"/></rect>
  <text x="360" y="235" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="700">A</text>
  <rect x="82" y="185" width="96" height="90" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="2.5"><animate attributeName="x" values="82;342;342;552" keyTimes="0;0.3;0.7;1" dur="6.0s" repeatCount="indefinite"/><animate attributeName="fill" values="#86efac;#86efac;#fca5a5;#fca5a5;#86efac;#86efac" keyTimes="0;0.25;0.255;0.75;0.755;1" dur="6.0s" repeatCount="indefinite"/><animate attributeName="stroke" values="#16a34a;#16a34a;#dc2626;#dc2626;#16a34a;#16a34a" keyTimes="0;0.25;0.255;0.75;0.755;1" dur="6.0s" repeatCount="indefinite"/></rect>
  <text x="130" y="235" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">B<animate attributeName="x" values="130;390;390;600" keyTimes="0;0.3;0.7;1" dur="6.0s" repeatCount="indefinite"/></text>

  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.255;0.75;0.755;1" dur="6.0s" repeatCount="indefinite"/>
    <text x="360" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626">Collision !</text>
  </g>

  <text x="360" y="332" text-anchor="middle" font-size="13" fill="#1b2a4a">Test : (A.gauche &lt; B.droite) ET (A.droite &gt; B.gauche) ET (A.haut &lt; B.bas) ET (A.bas &gt; B.haut).</text>
  <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#94a3b8">Quatre comparaisons suffisent : c'est le test de collision le plus rapide, fait à chaque image du jeu.</text>
</svg>
