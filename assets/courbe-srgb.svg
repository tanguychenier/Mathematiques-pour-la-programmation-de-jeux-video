  <text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#1b2a4a">La courbe orange plonge sous la diagonale : une valeur moyenne pèse bien moins de lumière qu'on ne croit.</text>
  <text x="360" y="418" text-anchor="middle" font-size="12.5" fill="#64748b">C'est pourquoi tout calcul d'éclairage se fait en lumière réelle (espace linéaire), pas sur la valeur stockée.</text>
</svg>
