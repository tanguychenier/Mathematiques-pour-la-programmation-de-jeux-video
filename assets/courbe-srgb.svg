<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="430" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="428" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">La courbe sRGB : pourquoi 50 % stocké n'est pas 50 % de lumière</text>

  <line x1="95" y1="330" x2="635" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="95" y1="330" x2="95" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="87" y="335" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="87" y="85" text-anchor="end" font-size="11" fill="#64748b">1</text>
  <text x="635" y="348" text-anchor="middle" font-size="11" fill="#64748b">1</text>
  <text x="365.0" y="348" text-anchor="middle" font-size="11" fill="#64748b">0,5</text>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" fill="#1b2a4a">valeur stockée dans la texture (pensée pour l'œil)</text>
  <text x="34" y="205.0" text-anchor="middle" font-size="12.5" fill="#1b2a4a" transform="rotate(-90 34 205)">lumière physique réelle</text>

  <polyline points="95.0,330.0 635.0,80.0" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="511" y="110" font-size="11.5" fill="#94a3b8" transform="rotate(-25 511 110)">valeur lue telle quelle (faux)</text>

