  <text x="375" y="268" font-size="12" fill="#0284c7" font-weight="700">0,5 stocké = seulement 21 % de lumière</text>

  <circle r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.4">
    <animate attributeName="cx" values="95.0;140.0;185.0;230.0;275.0;320.0;365.0;410.0;455.0;500.0;545.0;590.0;635.0;95.0" keyTimes="0.000;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1.000" dur="6s" repeatCount="indefinite"/>
