<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="380" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="378" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">L'interpolation linéaire (LERP) : glisser d'un point à un autre</text>
  <text x="360" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">Le réglage t va de 0 à 1. À t=0 on est en A, à t=1 on est en B, et entre les deux on avance proportionnellement.</text>

  <line x1="120" y1="250" x2="580" y2="150" stroke="#cbd5e1" stroke-width="2.5"/>
  <circle cx="235" cy="225" r="4" fill="#cbd5e1"/><text x="235" y="213" text-anchor="middle" font-size="10.5" fill="#94a3b8">t=0.25</text><circle cx="350" cy="200" r="4" fill="#cbd5e1"/><text x="350" y="188" text-anchor="middle" font-size="10.5" fill="#94a3b8">t=0.5</text><circle cx="465" cy="175" r="4" fill="#cbd5e1"/><text x="465" y="163" text-anchor="middle" font-size="10.5" fill="#94a3b8">t=0.75</text>
  <circle cx="120" cy="250" r="6" fill="#16a34a"/><text x="120" y="274" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">A (t=0)</text>
  <circle cx="580" cy="150" r="6" fill="#dc2626"/><text x="580" y="136" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="700">B (t=1)</text>
  <circle r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"><animate attributeName="cx" values="120;580;580;120" keyTimes="0;0.45;0.55;1" dur="5.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1"/><animate attributeName="cy" values="250;150;150;250" keyTimes="0;0.45;0.55;1" dur="5.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1"/></circle>

  <rect x="190" y="300" width="340" height="56" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="360" y="324" text-anchor="middle" font-size="15" fill="#1b2a4a">P(t) = (1 − t)·A + t·B</text>
  <text x="360" y="344" text-anchor="middle" font-size="11.5" fill="#64748b">t parts de B, (1−t) parts de A : un mélange dosé entre les deux points.</text>

  <text x="360" y="375" text-anchor="middle" font-size="11.5" fill="#94a3b8">Sert à déplacer une caméra, fondre une couleur, lisser un mouvement entre deux états.</text>
</svg>
