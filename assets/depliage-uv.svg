<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="380" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="378" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">Dépliage UV : découper l'objet en relief et l'aplatir sur l'image</text>

  <text x="180" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a4a">objet 3D</text>
  <polygon points="120,150 172,108 272,108 220,150" fill="#fde68a" stroke="#475569" stroke-width="1.5"/>
  <polygon points="220,150 272,108 272,208 220,250" fill="#bbf7d0" stroke="#475569" stroke-width="1.5"/>
  <polygon points="120,150 220,150 220,250 120,250" fill="#bfdbfe" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="205" text-anchor="middle" font-size="12" fill="#1e3a8a">face</text>
  <text x="196" y="135" text-anchor="middle" font-size="11" fill="#78350f">dessus</text>

  <text x="525" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a4a">image 2D (l'atlas UV)</text>
  <rect x="416" y="116" width="212" height="166" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="410" y="302" text-anchor="end" font-size="11" fill="#94a3b8">(0, 0)</text>
  <text x="634" y="110" text-anchor="start" font-size="11" fill="#94a3b8">(1, 1)</text>
  <rect x="476" y="130" width="46" height="46" fill="#fde68a" stroke="#475569" stroke-width="1.2"/><rect x="430" y="176" width="46" height="46" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/><rect x="476" y="176" width="46" height="46" fill="#bfdbfe" stroke="#475569" stroke-width="1.2"/><rect x="522" y="176" width="46" height="46" fill="#bbf7d0" stroke="#475569" stroke-width="1.2"/><rect x="568" y="176" width="46" height="46" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/><rect x="476" y="222" width="46" height="46" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="499" y="204" text-anchor="middle" font-size="12" fill="#1e3a8a">face</text>

  <path id="seam" d="M 300 175 Q 365 120 499 199" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.3">
    <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear">
      <mpath href="#seam"/>
    </animateMotion>
  </circle>

  <text x="360" y="348" text-anchor="middle" font-size="12.5" fill="#1b2a4a">On coupe l'objet le long de coutures bien choisies, puis on étale chaque morceau à plat.</text>
  <text x="360" y="367" text-anchor="middle" font-size="12.5" fill="#64748b">Chaque coin de l'objet reçoit ainsi une adresse (u, v) dans l'image : la couleur peinte ici habillera la face là-bas.</text>
</svg>
