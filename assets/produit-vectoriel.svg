<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="cb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="cg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="co" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="720" height="380" rx="14" fill="#fbfdff"/>
  <rect x="1" y="1" width="718" height="378" rx="14" fill="none" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2a4a">Le produit vectoriel u × v : la flèche perpendiculaire au plan</text>
  <text x="360" y="53" text-anchor="middle" font-size="12.5" fill="#64748b">u × v sort du plan formé par u et v. Sa longueur égale l'aire du parallélogramme qu'ils dessinent.</text>

  <polygon points="250,285 425,319 495,255 320,221" fill="#5eead4" fill-opacity="0.3" stroke="#0d9488" stroke-width="1.5"/>
  <text x="372" y="275" text-anchor="middle" font-size="12" fill="#0f766e">aire = ‖u × v‖</text>

  <line x1="250" y1="285" x2="425" y2="319" stroke="#2563eb" stroke-width="3.5" marker-end="url(#cb)"/>
  <text x="433" y="323" font-size="15" fill="#2563eb" font-weight="700">u</text>
  <line x1="250" y1="285" x2="320" y2="221" stroke="#16a34a" stroke-width="3.5" marker-end="url(#cg)"/>
  <text x="304" y="221" font-size="15" fill="#16a34a" font-weight="700">v</text>

  <line x1="250" y1="285" x2="250" y2="285" stroke="#ea580c" stroke-width="4.5" marker-end="url(#co)"><animate attributeName="y2" values="285;285;135;135;285" keyTimes="0;0.25;0.5;0.9;1" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/></line>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.42;0.9;1" dur="5.5s" repeatCount="indefinite"/>
    <text x="262" y="165" font-size="16" fill="#ea580c" font-weight="700">u × v</text>
    <text x="262" y="183" font-size="11.5" fill="#9a3412">perpendiculaire au sol</text>
  </g>
  <circle cx="250" cy="285" r="4" fill="#475569"/>

  <text x="360" y="344" text-anchor="middle" font-size="12.5" fill="#1b2a4a">Règle de la main droite : si vos doigts vont de u vers v, le pouce pointe dans le sens de u × v.</text>
  <text x="360" y="364" text-anchor="middle" font-size="11.5" fill="#94a3b8">C'est ainsi qu'un jeu calcule la normale d'une surface (la direction « vers le haut » d'un mur ou d'un sol).</text>
</svg>
